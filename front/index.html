<!DOCTYPE html>
<html lang="en">

<head>
    <title>AdminReg</title>
    <link rel="stylesheet" href="assets/w3.css" />
    <link rel="stylesheet" href="assets/dome.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Blinker:wght@100;200;300;400;600;700;800;900&family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check_circle,counter_1,counter_2,counter_3" />

    <script src="assets/js/simplewebauthn.min.js"></script>

</head>

<body>
    <header>
        <div class="dome-header">
            <div class="dome-content">
                <div class="w3-bar">
                    <div class="w3-bar-item padding-right-0">
                        <a href="#">
                            <img src="assets/logos/DOME_Icon_White.svg" alt="DOME Icon"
                                style="width:100%;max-height:32px">
                        </a>
                    </div>
                    <div class="w3-bar-item">
                        <span class="blinker-semibold w3-xlarge nowrap">DOME Onboarding Admin</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div style="background-color: #EDF2FA; min-height: 100vh;">
            <div class="w3-padding-32 w3-content">
            </div>

            <div class="w3-card-4 w3-content" style="max-width: 500px;">
                <div class="w3-container">

                    <h2>Login with your passkey</h2>
                    <div class="w3-section">
                        <button onclick="startLogin()" class="w3-button w3-round-large w3-blue">Login with
                            Passkey</button>
                    </div>

                </div>
            </div>
            <div class="w3-card-4 w3-content w3-margin-top" style="max-width: 500px;">
                <div class="w3-container">

                    <div class="w3-section">

                        <h2>Or register if this is the first time</h2>

                        <p>
                            <label>Enter the invitation code</label>
                            <input id="invitation_token" class="w3-input w3-border w3-round" name="invitation_token"
                                type="text">
                        </p>

                        <div class="w3-section">
                            <button onclick="startRegister()" class="w3-button w3-round-large w3-blue">Register
                                Passkey</button>
                        </div>
                    </div>
                </div>

            </div>


        </div>
    </main>

    <footer>
        <div class="dome-content">
        </div>
    </footer>


    <script type="module">
        import { checkPasskeySupport, createPasskeyRaw } from "./assets/js/passkeys.js"

        let available = await checkPasskeySupport()


        /** @typedef {object} CredentialAssertion
         * @property {PublicKeyCredentialRequestOptions} publicKey
         * @property {CredentialMediationRequirement} mediation
         */

        /** 
         * @typedef {object} startLoginResponse
         * @property {CredentialAssertion} credentialAssertion
         * @property {string} sessionid
         */

        async function startLogin() {
            debugger;
            const res = await fetch('api/login/begin');

            /** @type {startLoginResponse} */
            const resJSON = await res.json();

            const credentialAssertion = resJSON.credentialAssertion;
            const publicKey = credentialAssertion.publicKey;
            const sessionid = resJSON.sessionid;

            let assertion;
            try {
                // Pass the options to the authenticator and wait for a response
                assertion = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: publicKey });
            } catch (error) {
                // Some basic error handling
                if (error.name === 'InvalidStateError') {
                    alert('Error: Authenticator was probably already registered by user');
                } else {
                    alert(error);
                }

                throw error;
            }
            debugger;
            console.log(assertion)


            const finished = await fetch('api/login/finish?s=' + sessionid, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(assertion)
            });

            if (finished.ok) {
                const urlParams = new URLSearchParams(window.location.search);
                let nextUrl = urlParams.get('next') || '/';

                // Sanitize nextUrl to prevent open redirects (CWE-601)
                // It must start with '/' and not start with '//' or '\' or have colons in the path
                if (!nextUrl.startsWith('/') || nextUrl.startsWith('//') || nextUrl.startsWith('\\')) {
                    nextUrl = '/';
                } else if (nextUrl.includes(':')) {
                    const posCol = nextUrl.indexOf(':');
                    const posQM = nextUrl.indexOf('?');
                    const posHash = nextUrl.indexOf('#');
                    if ((posQM === -1 || posCol < posQM) && (posHash === -1 || posCol < posHash)) {
                        nextUrl = '/';
                    }
                }

                window.location.href = nextUrl;
            } else {
                alert("verification failed")
            }

        }

        /** @typedef {object} CredentialOptions
         * @property {PublicKeyCredentialCreationOptions} publicKey
         * @property {CredentialMediationRequirement} mediation
         */

        /** 
         * @typedef {object} startRegisterResponse
         * @property {CredentialOptions} credentialOptions
         * @property {string} sessionid
         */

        async function startRegister() {

            // Get the invitation code
            const tokenElem = document.getElementById("invitation_token");
            if (!tokenElem || tokenElem.value === '') {
                alert("Please enter an invitation token.");
                return;
            }

            const token = tokenElem.value

            debugger;
            const res = await fetch('api/register/begin?t=' + token);
            if (!res.ok) {
                alert("error calling beginRegistration")
                return
            }

            /** @type {startRegisterResponse} */
            const resJSON = await res.json();

            const credentialOptions = resJSON.credentialOptions;
            const publicKey = credentialOptions.publicKey;

            let attestation;
            try {
                // Pass the options to the authenticator and wait for a response
                attestation = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON: publicKey });
            } catch (error) {
                // Some basic error handling
                if (error.name === 'InvalidStateError') {
                    alert('Error: Authenticator was probably already registered by user');
                } else {
                    alert(error);
                }

                throw error;
            }

            const finished = await fetch('api/register/finish?t=' + token, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(attestation)
            });

            if (!finished.ok) {
                alert("error calling finishRegistration")
                return
            }

            window.location.href = "/";
        }

        window.startRegister = startRegister
        window.startLogin = startLogin

    </script>


</body>

</html>
